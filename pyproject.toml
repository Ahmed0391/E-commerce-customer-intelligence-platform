[project]
name = "cip"
version = "0.0.1"
description = "Customer intelligence platform: behavioral + conversational signals -> evidence-grounded recommendations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
text = ["datasets>=2.18"]          # fills conversation text from Bitext
dev = ["pytest>=8", "scikit-learn>=1.4", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
